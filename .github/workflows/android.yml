name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner ubuntu sudah membawa Android SDK; action setup-android@v3 justru
      # gagal (sdkmanager memanggil paket 'tools' yang sudah tidak ada).
      # Install eksplisit platform + build-tools yang dipakai app (compileSdk 34).
      - name: Install Android platform + build-tools
        run: |
          set -eux
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # ---- Model dibundel ke APK saat build (tanpa unduhan runtime) ----
      # PP-OCRv6-small = utama (det + rec). Korea v5-mobile = pendamping Hangul.
      - name: Download ONNX models into assets
        run: |
          set -eux
          mkdir -p app/src/main/assets/models
          cd app/src/main/assets/models
          curl -fL -o ppocrv6_small_det.onnx \
            https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/main/inference.onnx
          curl -fL -o ppocrv6_small_rec.onnx \
            https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx
          curl -fL -o korean_v5_mobile_rec.onnx \
            https://huggingface.co/PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx
          ls -la
          python3 - <<'EOF'
          import os
          for f, lo in [("ppocrv6_small_det.onnx", 5_000_000),
                        ("ppocrv6_small_rec.onnx", 10_000_000),
                        ("korean_v5_mobile_rec.onnx", 5_000_000)]:
              sz = os.path.getsize(f)
              assert sz > lo, f"{f} too small: {sz}"
              print(f, sz)
          EOF

      # ---- Release keystore (password 161105) ----
      # PENTING: pakai kembali keystore build sebelumnya agar tanda tangan SAMA
      # (APK terinstall tidak perlu uninstall). Hanya bila tidak ada (build
      # pertama) keystore baru dibuat. JKS ikut di-upload sebagai artefak
      # cadangan — simpan salinannya di tempat aman, jangan commit ke repo!
      - name: Restore previous release keystore
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: android.yml
          branch: main
          name: GrooxOCR-release-keystore
          path: keystore/
          if_no_artifact_found: warn

      - name: Generate release keystore
        run: |
          set -eux
          mkdir -p keystore
          if [ ! -f keystore/groox-release.jks ]; then
            keytool -genkeypair \
              -keystore keystore/groox-release.jks \
              -alias groox -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass 161105 -keypass 161105 \
              -dname "CN=GrooxOCR, OU=Groox, O=Groox, L=Jakarta, C=ID"
          fi
          keytool -list -keystore keystore/groox-release.jks -storepass 161105 | head -n 5

      # ---- Model terjemahan MarianMT INT8 (Xenova, dibundel ke APK) ----
      # ko-en + en-id (ko-id = rantai keduanya). Tanpa unduhan runtime.
      # Decoder TERPISAH (tanpa node If) = jalur utama; merged = fallback.
      - name: Download MT INT8 models into assets
        run: |
          set -eux
          mkdir -p app/src/main/assets/mt/ko-en app/src/main/assets/mt/en-id
          curl -fL -o app/src/main/assets/mt/ko-en/encoder_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-ko-en/resolve/main/onnx/encoder_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/ko-en/decoder_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-ko-en/resolve/main/onnx/decoder_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/ko-en/decoder_with_past_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-ko-en/resolve/main/onnx/decoder_with_past_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/ko-en/decoder_merged_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-ko-en/resolve/main/onnx/decoder_model_merged_int8.onnx
          curl -fL -o app/src/main/assets/mt/ko-en/tokenizer.json \
            https://huggingface.co/Xenova/opus-mt-ko-en/resolve/main/tokenizer.json
          curl -fL -o app/src/main/assets/mt/en-id/encoder_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-en-id/resolve/main/onnx/encoder_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/en-id/decoder_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-en-id/resolve/main/onnx/decoder_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/en-id/decoder_with_past_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-en-id/resolve/main/onnx/decoder_with_past_model_int8.onnx
          curl -fL -o app/src/main/assets/mt/en-id/decoder_merged_int8.onnx \
            https://huggingface.co/Xenova/opus-mt-en-id/resolve/main/onnx/decoder_model_merged_int8.onnx
          curl -fL -o app/src/main/assets/mt/en-id/tokenizer.json \
            https://huggingface.co/Xenova/opus-mt-en-id/resolve/main/tokenizer.json
          ls -la app/src/main/assets/mt/ko-en app/src/main/assets/mt/en-id
          python3 - <<'EOF'
          import os
          for d in ["app/src/main/assets/mt/ko-en", "app/src/main/assets/mt/en-id"]:
              for f, lo in [("encoder_int8.onnx", 5_000_000),
                            ("decoder_int8.onnx", 5_000_000),
                            ("decoder_with_past_int8.onnx", 5_000_000),
                            ("decoder_merged_int8.onnx", 5_000_000),
                            ("tokenizer.json", 100_000)]:
                  p = os.path.join(d, f)
                  sz = os.path.getsize(p)
                  assert sz > lo, f"{p} too small: {sz}"
                  print(p, sz)
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK (signed, 161105)
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrooxOCR-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GrooxOCR-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release keystore (simpan aman!)
        uses: actions/upload-artifact@v4
        with:
          name: GrooxOCR-release-keystore
          path: keystore/groox-release.jks
